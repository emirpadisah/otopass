project_id = "otopass"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/login/reset-password"]
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
max_frequency = "60s"
otp_length = 8
otp_expiry = 600

[auth.email.template.magic_link]
subject = "otoköprü e-posta doğrulama kodunuz"
content_path = "./supabase/templates/email-verification.html"

[auth.email.template.confirmation]
subject = "otoköprü e-posta doğrulama kodunuz"
content_path = "./supabase/templates/email-verification.html"

[storage]
enabled = true
file_size_limit = "10MiB"
